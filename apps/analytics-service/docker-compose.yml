services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
      POSTGRES_DB: amm_analytics
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - analytics_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics -d amm_analytics"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  analytics_postgres_data:
